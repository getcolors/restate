---
- name: Install production single-node Restate
  hosts: restate
  become: true
  gather_facts: false
  pre_tasks:
    - ansible.builtin.wait_for_connection: {connect_timeout: 10, delay: 5, sleep: 5, timeout: 600}
    - ansible.builtin.setup:
  tasks:
    - name: Install Docker and backup tooling
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, awscli, ca-certificates, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - ansible.builtin.systemd_service: {name: docker, enabled: true, state: started}
    - ansible.builtin.file: {path: /opt/restate/app/src, state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "<{ restate-data-dir }>", state: directory, mode: "0755"}
    - ansible.builtin.file: {path: /var/lib/restate-app, state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "<{ restate-backup-dir }>", state: directory, mode: "0700"}
    - name: Install stack configuration
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - {src: compose.yml, dest: /opt/restate/compose.yml}
        - {src: Caddyfile, dest: /opt/restate/Caddyfile}
        - {src: backup, dest: /usr/local/sbin/restate-backup, mode: "0700"}
        - {src: app/Dockerfile, dest: /opt/restate/app/Dockerfile}
        - {src: app/package.json, dest: /opt/restate/app/package.json}
        - {src: app/package-lock.json, dest: /opt/restate/app/package-lock.json}
        - {src: app/tsconfig.json, dest: /opt/restate/app/tsconfig.json}
        - {src: app/src/index.ts, dest: /opt/restate/app/src/index.ts}
      notify: Restart Restate stack
    - name: Install backup credentials outside generated and tracked files
      ansible.builtin.copy:
        dest: /etc/restate-backup.env
        mode: "0600"
        content: |
          RESTATE_BACKUP_R2_ACCESS_KEY_ID={{ lookup('env','COLORS_PAR_RESTATE_BACKUP_R2_ACCESS_KEY_ID') }}
          RESTATE_BACKUP_R2_SECRET_ACCESS_KEY={{ lookup('env','COLORS_PAR_RESTATE_BACKUP_R2_SECRET_ACCESS_KEY') }}
      no_log: true
    - name: Install backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/restate-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Consistent Restate single-node backup
          Requires=docker.service
          After=docker.service
          [Service]
          Type=oneshot
          EnvironmentFile=/etc/restate-backup.env
          ExecStart=/usr/local/sbin/restate-backup
      notify: Reload systemd
    - name: Install backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/restate-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily Restate backup
          [Timer]
          OnCalendar=<{ restate-backup-oncalendar }>
          Persistent=true
          RandomizedDelaySec=300
          [Install]
          WantedBy=timers.target
      notify: Reload systemd
    - ansible.builtin.meta: flush_handlers
    - name: Build and converge pinned containers
      ansible.builtin.command: docker compose up -d --build --remove-orphans
      args: {chdir: /opt/restate}
      register: compose_up
      changed_when: "'Built' in (compose_up.stdout + compose_up.stderr) or 'Created' in (compose_up.stdout + compose_up.stderr) or 'Recreated' in (compose_up.stdout + compose_up.stderr)"
    - ansible.builtin.systemd_service: {name: restate-backup.timer, enabled: true, state: started}
    - name: Wait for public application locally
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: local_health
      retries: 60
      delay: 5
      until: local_health.status == 200
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service: {daemon_reload: true}
    - name: Restart Restate stack
      ansible.builtin.command: docker compose up -d --build --remove-orphans
      args: {chdir: /opt/restate}
